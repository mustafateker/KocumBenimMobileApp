name: Release Internal

# Manuel tetikleme (Actions sekmesinden tek tıkla) veya internal etiket push'u ile çalışır:
# git tag v1.0.0-internal.1 && git push origin v1.0.0-internal.1
on:
  workflow_dispatch:
  push:
    tags:
      - "v*-internal*"
      - "internal-*"

concurrency:
  group: release-internal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Compute versionCode
        id: vc
        run: echo "code=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Configure release signing and versionCode
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.vc.outputs.code }}
        run: node scripts/patch-android-release.js

      - name: Build release bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.triworkster.kocumbenimmobileapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${GITHUB_REF_NAME:-}"
          if [[ "$REF" == v* || "$REF" == internal* ]]; then
            TAG="$REF"
          else
            VERSION=$(node -p "require('./app.json').expo.version")
            TAG="v${VERSION}-internal.${{ steps.vc.outputs.code }}"
            git tag "$TAG"
            git push origin "$TAG" || true
          fi
          gh release create "$TAG" --title "Internal Build ${{ steps.vc.outputs.code }}" --prerelease --generate-notes || true
